<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Last Resort</title>
  <meta name="description" content="Last Resort — small, useful things, shipped fast.">
  <style>
    :root {
      --bg: #0f1115;
      --fg: #e8e6e1;
      --muted: #9a978f;
      --accent: #e0a458;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    main { max-width: 40rem; text-align: center; }
    h1 {
      font-size: clamp(2.25rem, 6vw, 3.5rem);
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }
    h1 span { color: var(--accent); }
    p.tagline {
      font-size: 1.125rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }
    .cta {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border: 1px solid var(--accent);
      border-radius: 999px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      transition: background 150ms ease, color 150ms ease;
    }
    .cta:hover { background: var(--accent); color: var(--bg); }
    footer {
      margin-top: 4rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Last <span>Resort</span></h1>
    <p class="tagline">
      Small, useful things — shipped fast.<br>
      Something worth paying for is on the way.
    </p>
    <a class="cta" href="mailto:cryptominbutton@gmail.com?subject=Last%20Resort">Get in touch</a>
    <footer>&copy; 2026 Last Resort</footer>
  </main>
</body>
</html>
